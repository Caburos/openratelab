name: Fix desktop motion

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-desktop-motion.yml

permissions:
  contents: write

jobs:
  patch-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Apply desktop motion fix
        run: python .github/scripts/fix_desktop_motion.py
      - name: Diff QA
        run: |
          git diff --check
          git diff -- astro-site/src/pages/index.astro
          grep -q "Use one choreography engine everywhere" astro-site/src/pages/index.astro
          ! grep -q "if (!isMobile && hasViewTimeline) return" astro-site/src/pages/index.astro
      - name: Install
        working-directory: astro-site
        run: npm ci
      - name: Build
        working-directory: astro-site
        run: npm run build
      - name: Commit fix
        run: |
          git config user.name "OpenRateLab QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add astro-site/src/pages/index.astro
          git commit -m "Fix desktop homepage motion trigger"
          git push
