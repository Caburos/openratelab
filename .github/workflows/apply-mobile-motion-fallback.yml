name: Apply mobile motion fallback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-mobile-motion-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch homepage
        run: python .github/scripts/apply_mobile_motion.py

      - name: QA patch
        run: |
          git diff --check
          grep -q "Cross-browser mobile motion fallback" astro-site/src/pages/index.astro
          grep -q "orl-motion-fallback" astro-site/src/pages/index.astro

      - name: Commit patch
        run: |
          git config user.name "OpenRateLab QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add astro-site/src/pages/index.astro
          git commit -m "Fix homepage animations on mobile browsers"
          git push origin main
