name: QA homepage mobile fallback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/qa-homepage-mobile.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: astro-site/package-lock.json
      - name: Install
        working-directory: astro-site
        run: npm ci
      - name: Build
        working-directory: astro-site
        run: npm run build
