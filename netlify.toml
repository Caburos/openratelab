[build]
  base = "astro-site"
  command = "npm ci && npm run build"
  publish = "dist"
# Cutover to Astro: 2026-09-01. Previous static-HTML config preserved in
# git history (see the pre-astro-migration tag) if a rollback is needed.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sitemap-index.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=604800"

# Functions directory: netlify/functions lives at the REPO ROOT, but
# `base = "astro-site"` makes every relative path in this file resolve
# from astro-site/ instead — including this one. Go back up one level.
[functions]
  directory = "../netlify/functions"

# Contact form API → Netlify function
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# Trailing-slash normalization: no trailing slash on individual posts/case
# studies is canonical (CLAUDE.md). Astro's static build emits a directory
# index.html either way, so both forms resolve — this makes the no-slash
# form authoritative instead of leaving two working URLs for one page.
[[redirects]]
  from = "/case-studies/:slug/"
  to = "/case-studies/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/blog/:slug/"
  to = "/blog/:slug"
  status = 301
  force = true

# Case study URL renames from the NDA-compliance pass — still needed
# post-cutover since old indexed/bookmarked links may still hit these.
[[redirects]]
  from = "/case-studies/specialty-supplement-brand-182k"
  to = "/case-studies/specialty-supplement-brand"
  status = 301
  force = true

[[redirects]]
  from = "/case-studies/specialty-supplement-brand-182k.html"
  to = "/case-studies/specialty-supplement-brand"
  status = 301
  force = true

[[redirects]]
  from = "/case-studies/lifestyle-wellness-brand-80pct"
  to = "/case-studies/lifestyle-wellness-brand"
  status = 301
  force = true

[[redirects]]
  from = "/case-studies/lifestyle-wellness-brand-80pct.html"
  to = "/case-studies/lifestyle-wellness-brand"
  status = 301
  force = true

[[redirects]]
  from = "/case-studies/nutrition-brand-69k-revenue"
  to = "/case-studies/nutrition-brand-revenue"
  status = 301
  force = true

[[redirects]]
  from = "/case-studies/nutrition-brand-69k-revenue.html"
  to = "/case-studies/nutrition-brand-revenue"
  status = 301
  force = true
